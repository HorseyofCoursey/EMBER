; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:cardputer-adv]
; Default release (M5Burner/launcher) -- no Subsonic/Gonic streaming. That
; feature links in WiFi/HTTPClient/WiFiClientSecure, which costs ~16KB of
; heap just by being present (not by being used), which is the room the
; full-screen visualizer needs to survive a real session's heap
; fragmentation -- most users don't use Gonic, so this build drops it
; entirely to get the room back and keep full-screen visualizers reliable.
; See env:cardputer-adv-gonic below for the Gonic-enabled build (GitHub
; releases only), which trades the opposite way: Gonic streaming, no
; full-screen visualizer.
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-DESP32S3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
build_src_filter =
	+<*>
	-<network.cpp>
	-<AudioFileSourceHTTPRange.cpp>
lib_deps =
	m5stack/M5Cardputer @ ^1.1.1
	https://github.com/earlephilhower/ESP8266Audio.git#1.9.7
	m5stack/M5Unified @ ^0.2.11
	m5stack/M5GFX @ ^0.2.17
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

[env:cardputer-adv-gonic]
; Gonic-enabled build (GitHub releases only, not the M5Burner default) --
; see the note above env:cardputer-adv for the tradeoff this makes.
extends = env:cardputer-adv
build_flags =
	${env:cardputer-adv.build_flags}
	-DENABLE_GONIC
build_src_filter =
	+<*>
	-<network_stub.cpp>

[platformio]
description = EMBER
